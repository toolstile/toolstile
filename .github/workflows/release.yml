name: Release

# Builds the single executable for a version tag and attaches it to a draft release.
# A maintainer writes the notes and publishes the draft by hand.
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the tag against package.json
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  executable:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keep the pnpm store in this job's temporary directory
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      # Same Vite+, Node.js and pnpm as the executable job in ci.yml.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.5.1
          node-version: 26.13.1
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Build the executable and run its lifecycle
        env:
          TOOLSTILE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          vp run build:binary --compress
          vp run test:binary
      # toolstile-server-<os>-<arch>.br is what `npx toolstile server` downloads, and the
      # .sha256 file holds the digest of the decompressed executable.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/toolstile-server-*.br
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/toolstile-server-*.br
            dist/toolstile-server-*.sha256
          if-no-files-found: error
          retention-days: 7
  release:
    needs: executable
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=()
          for platform in darwin-arm64 linux-arm64 linux-x64; do
            for suffix in br sha256; do
              test -s "dist/toolstile-server-$platform.$suffix"
              files+=("dist/toolstile-server-$platform.$suffix")
            done
          done
          test "$(find dist -type f | wc -l)" -eq 6
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes ""
