name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Set up pinned pnpm with an isolated store
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/corepack-bin:$PATH" corepack install -g pnpm@11.20.0
      - name: Install frozen dependencies
        run: pnpm --dir . install --frozen-lockfile
      - name: Security, types and lint
        run: |
          pnpm --dir . security:check
          pnpm --dir . lint
          pnpm --dir . check
      - name: Node production build and complete PostgreSQL suite
        run: |
          pnpm --dir . build
          pnpm --dir . test:local
