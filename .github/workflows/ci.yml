name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keep the pnpm store in this job's temporary directory
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      # vp installs Node.js 26.13.1 and the pnpm in packageManager; version matches vite-plus in package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.5.1
          node-version: 26.13.1
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Security, types and lint
        run: |
          vp run security:check
          vp run lint
          vp run check
      - name: Node production build and complete PostgreSQL suite
        run: |
          vp run build
          vp run test:local
  executable:
    # Builds and exercises the single executable on each platform; nothing is uploaded.
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keep the pnpm store in this job's temporary directory
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.5.1
          node-version: 26.13.1
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Build the executable and run its lifecycle
        run: |
          vp run build:binary
          vp run test:binary
