apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolstile
spec:
  replicas: 1
  # MCP sessions belong to one process. Never overlap owners during rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: toolstile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolstile
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: toolstile:local
          imagePullPolicy: IfNotPresent
          # Run the reviewed release Job first; serve repeats locked migrations.
          args: [serve]
          envFrom:
            - configMapRef:
                name: toolstile-config
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/database_url
            - name: BETTER_AUTH_SECRET_FILE
              value: /run/secrets/auth_secret
            - name: ENCRYPTION_KEY_FILE
              value: /run/secrets/encryption_key
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret:
            secretName: toolstile-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
